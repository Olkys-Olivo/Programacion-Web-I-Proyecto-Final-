<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de ITBIS</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>

    <main class="main">

        <h1 class="main__title">Cálculo de ITBIS</h1>

        <section class="section">

            <form class="form">

                <fieldset class="datos">
                    <legend>Datos de la Venta</legend>

                    <input
                        type="number"
                        class="input"
                        id="monto"
                        placeholder="Ingrese el monto de la venta">

                    <select class="select" id="tipo">
                        <option value="18">ITBIS 18%</option>
                        <option value="16">ITBIS 16%</option>
                    </select>

                </fieldset>

                <fieldset class="resultado">

                    <legend>Resultado</legend>

                    <input
                        type="text"
                        class="input"
                        id="itbis"
                        placeholder="ITBIS"
                        readonly>

                    <input
                        type="text"
                        class="input"
                        id="total"
                        placeholder="Total con ITBIS"
                        readonly>

                </fieldset>

                <button type="button" class="boton">
                    CALCULAR
                </button>

                <button type="reset" class="boton">
                    LIMPIAR
                </button>

                <a href="index.html" class="volver">
                    ← Volver al menú principal
                </a>

            </form>

        </section>

    </main>

    <script type="module" src="/src/main.js"></script>

</body>

</html>
