<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Nómina</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>

    <main class="main">

        <h1 class="main__title">Cálculo de Nómina</h1>

        <section class="section">

            <form class="form">

                <fieldset class="datos">
                    <legend>Datos del Empleado</legend>

                    <input
                        type="text"
                        class="input"
                        id="nombre"
                        placeholder="Nombre del empleado">

                    <input
                        type="number"
                        class="input"
                        id="salarioBruto"
                        placeholder="Salario bruto">

                </fieldset>

                <fieldset class="resultado">

                    <legend>Resultado</legend>

                    <input
                        type="text"
                        class="input"
                        id="afp"
                        placeholder="Descuento AFP"
                        readonly>

                    <input
                        type="text"
                        class="input"
                        id="sfs"
                        placeholder="Descuento SFS"
                        readonly>

                    <input
                        type="text"
                        class="input"
                        id="isr"
                        placeholder="ISR"
                        readonly>

                    <input
                        type="text"
                        class="input"
                        id="salarioNeto"
                        placeholder="Salario Neto"
                        readonly>

                </fieldset>

                <button type="button" class="boton">
                    CALCULAR
                </button>

                <button type="reset" class="boton">
                    LIMPIAR
                </button>

                <a href="index.html" class="volver">
                    ← Volver al menú principal
                </a>

            </form>

        </section>

    </main>

    <script type="module" src="/src/main.js"></script>

</body>

</html>
