<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interés Simple</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>

    <main class="main">

        <h1 class="main__title">Interés Simple</h1>

        <section class="section">

            <form class="form">

                <fieldset class="datos">

                    <legend>Datos de la Inversión</legend>

                    <input
                        type="number"
                        class="input"
                        id="capital"
                        placeholder="Capital inicial">

                    <input
                        type="number"
                        class="input"
                        id="tasa"
                        placeholder="Tasa de interés (%)">

                    <input
                        type="number"
                        class="input"
                        id="tiempo"
                        placeholder="Tiempo (años)">

                </fieldset>

                <fieldset class="resultado">

                    <legend>Resultado</legend>

                    <input
                        type="text"
                        class="input"
                        id="interes"
                        placeholder="Interés generado"
                        readonly>

                    <input
                        type="text"
                        class="input"
                        id="montoFinal"
                        placeholder="Monto final"
                        readonly>

                </fieldset>

                <button type="button" class="boton">
                    CALCULAR
                </button>

                <button type="reset" class="boton">
                    LIMPIAR
                </button>

                <a href="index.html" class="volver">
                    ← Volver al menú principal
                </a>

            </form>

        </section>

    </main>

    <script type="module" src="/src/main.js"></script>

</body>

</html>
